<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse PGs — Bengaluru</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══ PG Finder — Shared Styles ═══ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#0F6E56;--gm:#1D9E75;--gl:#E1F5EE;--gp:#F0FAF6;
  --b:#185FA5;--bl:#E6F1FB;
  --am:#BA7517;--al:#FAEEDA;
  --r:#A32D2D;--rl:#FCEBEB;
  --gray-9:#111;--gray-8:#1f1f1f;--gray-7:#2C2C2A;--gray-6:#5F5E5A;
  --gray-4:#9c9a94;--gray-3:#D3D1C7;--gray-2:#EDECEA;--gray-1:#F7F6F3;
  --white:#fff;
  --radius:10px;--radius-lg:14px;--radius-xl:18px;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 4px 20px rgba(0,0,0,.12),0 12px 40px rgba(0,0,0,.08);
}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;color:var(--gray-7);background:var(--gray-2);min-height:100vh}

/* ── Topbar ── */
.topbar{background:var(--white);border-bottom:1px solid var(--gray-3);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;gap:12px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;color:var(--g);text-decoration:none;white-space:nowrap}
.brand-dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--gm),var(--g))}
.back-link{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gray-6);text-decoration:none;padding:5px 10px;border-radius:8px;border:1px solid var(--gray-3);transition:all .15s}
.back-link:hover{background:var(--gray-1);color:var(--gray-7)}
.topbar-right{display:flex;align-items:center;gap:8px}
.user-chip{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;background:var(--gl);color:var(--g);border:1px solid rgba(29,158,117,.25)}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--gray-6);padding:4px 10px;border-radius:20px;border:1px solid var(--gray-3)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--gray-3)}
.sdot.ok{background:#22c55e}.sdot.spin{background:#f59e0b;animation:pulse 1s infinite}.sdot.err{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Wrap ── */
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}

/* ── Stats row ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--white);border:1px solid var(--gray-3);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:700;color:var(--g)}
.stat .l{font-size:11px;font-weight:500;color:var(--gray-6);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}

/* ── Buttons ── */
.btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--gray-3);background:var(--white);cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .15s;color:var(--gray-7);font-family:inherit}
.btn:hover{background:var(--gray-1)}
.btn:active{transform:scale(.98)}
.btn-green{background:var(--gm);color:#fff;border-color:var(--gm)}
.btn-green:hover{background:var(--g)}
.btn-blue{background:var(--b);color:#fff;border-color:var(--b)}
.btn-blue:hover{background:#134d88}
.btn-red{border-color:#fca5a5;color:var(--r)}
.btn-red:hover{background:var(--rl)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;width:32px;height:32px;justify-content:center;flex-shrink:0}

/* ── Cards ── */
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.pg-card{background:var(--white);border:1px solid var(--gray-3);border-radius:var(--radius-xl);overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.pg-card:hover{border-color:var(--gm);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.pg-card-thumb{width:100%;height:150px;object-fit:cover;background:var(--gray-2)}
.pg-card-thumb-empty{width:100%;height:150px;background:linear-gradient(135deg,var(--gp),var(--gl));display:flex;align-items:center;justify-content:center;font-size:36px}
.pg-card-body{padding:14px 16px}
.pg-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.pg-card-name{font-size:15px;font-weight:700;line-height:1.3}
.score-pill{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pg-card-loc{font-size:12px;color:var(--gray-6);margin-bottom:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.pg-card-dist{font-size:11px;color:var(--b);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:4px}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--gray-2);color:var(--gray-6);border:1px solid var(--gray-3)}
.rent-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.rent-pill{background:var(--bl);color:var(--b);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.pg-card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--gray-3);padding-top:10px;margin-top:8px}
.pg-card-contact{font-size:12px;color:var(--gray-6)}
.pg-card-actions{display:flex;gap:4px}
.empty{text-align:center;padding:70px 20px;color:var(--gray-6);grid-column:1/-1}
.empty-icon{font-size:56px;display:block;margin-bottom:14px}

/* ── Detail panel ── */
.detail{background:var(--white);border:1px solid var(--gray-3);border-radius:var(--radius-xl);margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow-lg)}
.detail-hero{position:relative}
.detail-hero-img{width:100%;height:220px;object-fit:cover}
.detail-hero-empty{height:120px;background:linear-gradient(135deg,var(--gp),var(--gl));display:flex;align-items:center;justify-content:center;font-size:48px}
.detail-hdr{padding:18px 20px 12px;border-bottom:1px solid var(--gray-3);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.detail-body{padding:20px}
.dsec{margin-bottom:22px}
.dsec-title{font-size:11px;font-weight:600;color:var(--gray-6);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--gray-3)}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.di{background:var(--gray-1);border-radius:9px;padding:10px 12px}
.di .dl{font-size:11px;color:var(--gray-6);margin-bottom:3px;font-weight:500}
.di .dv{font-size:14px;font-weight:600}
.am-row{display:flex;flex-wrap:wrap;gap:6px}
.am{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--gray-3);font-weight:500}
.am.yes{background:var(--gl);color:var(--g);border-color:rgba(29,158,117,.3)}
.am.no{background:var(--rl);color:var(--r);border-color:rgba(163,45,45,.2)}
.rev{padding:10px 0;border-bottom:1px solid var(--gray-3)}
.rev:last-child{border:none}
.rev-score{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;margin-bottom:5px;background:var(--al);color:var(--am)}
.rev-txt{font-size:13px;color:var(--gray-6);line-height:1.5}

/* ── Photo grid ── */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.photo-thumb{width:100%;aspect-ratio:4/3;border-radius:9px;object-fit:cover;cursor:pointer;border:1px solid var(--gray-3);transition:transform .15s}
.photo-thumb:hover{transform:scale(1.04)}
.photo-empty{aspect-ratio:4/3;border-radius:9px;border:1.5px dashed var(--gray-3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;color:var(--gray-3)}

/* ── Form ── */
.fsec{background:var(--white);border:1px solid var(--gray-3);border-radius:var(--radius-xl);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.fsec-title{font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--gray-3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.frow.one{grid-template-columns:1fr}.frow.three{grid-template-columns:1fr 1fr 1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:12px;color:var(--gray-6);font-weight:500}
.fg input,.fg select,.fg textarea{padding:9px 11px;border-radius:var(--radius);border:1px solid var(--gray-3);background:var(--white);font-size:13px;color:var(--gray-7);font-family:inherit;transition:border .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gm);box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.fg textarea{resize:vertical;min-height:72px;line-height:1.5}
.amen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;padding:9px 11px;border-radius:var(--radius);border:1px solid var(--gray-3);background:var(--white);transition:all .15s;font-weight:500;user-select:none}
.ach:hover{background:var(--gp);border-color:var(--gm)}
.ach input{width:15px;height:15px;accent-color:var(--gm);cursor:pointer}
.ach.checked{background:var(--gl);border-color:rgba(29,158,117,.4)}
.rev-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rev-row input{padding:8px 10px;border-radius:var(--radius);border:1px solid var(--gray-3);font-size:13px;font-family:inherit}
.rev-row .rt{flex:1}.rev-row .rs{width:70px;text-align:center}
.upzone{border:2px dashed var(--gray-3);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;font-size:12px;color:var(--gray-6);transition:all .15s;margin-bottom:8px}
.upzone:hover{background:var(--gp);border-color:var(--gm);color:var(--g)}
.prevrow{display:flex;flex-wrap:wrap;gap:6px}
.previtem{position:relative;width:76px;height:58px}
.previtem img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--gray-3)}
.prm{position:absolute;top:-5px;right:-5px;background:var(--r);color:#fff;border:none;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.progress-bar{height:3px;background:var(--gray-3);border-radius:2px;margin-top:4px;overflow:hidden;display:none}
.progress-bar.show{display:block}
.progress-fill{height:100%;background:var(--gm);border-radius:2px;width:0;transition:width .2s}

/* ── Compare table ── */
.compare-table{width:100%;border-collapse:collapse;font-size:13px}
.compare-table th{background:var(--g);color:#fff;padding:10px 14px;font-weight:600;text-align:left;font-size:12px}
.compare-table th:first-child{width:180px;background:var(--gray-7)}
.compare-table td{padding:9px 14px;border-bottom:1px solid var(--gray-3);vertical-align:top}
.compare-table tr:nth-child(even) td{background:var(--gray-1)}
.compare-table td:first-child{font-weight:500;color:var(--gray-6);font-size:12px}
.best-cell{background:var(--gl)!important;color:var(--g);font-weight:700}
.yes-cell{color:var(--g);font-weight:600}.no-cell{color:var(--r)}
.compare-section-row td{background:var(--gray-7)!important;color:#fff;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:6px 14px}

/* ── Search bar ── */
.sbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.sbar input,.sbar select{padding:9px 12px;border-radius:var(--radius);border:1px solid var(--gray-3);background:var(--white);font-size:13px;color:var(--gray-7);font-family:inherit;transition:border .15s}
.sbar input:focus,.sbar select:focus{outline:none;border-color:var(--gm)}
.sbar input{flex:1;min-width:200px}
.sbar .divider{width:1px;height:28px;background:var(--gray-3);flex-shrink:0}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--gray-3);margin-bottom:20px;padding-bottom:0}
.tab{padding:9px 16px;border-radius:var(--radius) var(--radius) 0 0;border:1px solid transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--gray-6);transition:all .15s;font-family:inherit;background:transparent;display:flex;align-items:center;gap:6px;margin-bottom:-1px}
.tab.active{background:var(--white);border-color:var(--gray-3);border-bottom-color:var(--white);color:var(--gray-7)}
.tab:hover:not(.active){background:var(--gray-1);color:var(--gray-7)}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:var(--radius-xl);padding:28px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.modal h2{font-size:20px;font-weight:700;margin-bottom:6px}
.modal .msub{font-size:13px;color:var(--gray-6);margin-bottom:20px;line-height:1.6}

/* ── Auth ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--gray-2);padding:20px}
.auth-card{background:var(--white);border-radius:var(--radius-xl);padding:36px;max-width:400px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--gray-3)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-title{font-size:22px;font-weight:700;margin-bottom:6px;text-align:center}
.auth-sub{font-size:13px;color:var(--gray-6);text-align:center;margin-bottom:24px}
.auth-error{background:var(--rl);color:var(--r);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}

/* ── Admin user table ── */
.user-table{width:100%;border-collapse:collapse;font-size:13px}
.user-table th{background:var(--gray-1);padding:9px 14px;font-weight:600;text-align:left;font-size:12px;color:var(--gray-6);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--gray-3)}
.user-table td{padding:10px 14px;border-bottom:1px solid var(--gray-3);vertical-align:middle}
.user-table tr:last-child td{border:none}
.status-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.status-active{background:var(--gl);color:var(--g)}
.status-paused{background:var(--rl);color:var(--r)}

/* ── Lightbox ── */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column}
.lb.show{display:flex}
.lb img{max-width:92vw;max-height:85vh;border-radius:10px;object-fit:contain}
.lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:26px;cursor:pointer;background:rgba(255,255,255,.1);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gray-7);color:#fff;padding:11px 22px;border-radius:30px;font-size:13px;font-weight:500;z-index:2000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1}
.toast.err{background:#991b1b}
.toast.ok{background:var(--g)}

/* ── Loader ── */
.loader{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:12px;color:var(--gray-6);font-size:13px}
.spin{width:28px;height:28px;border:3px solid var(--gray-3);border-top-color:var(--gm);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Distance badge ── */
.dist-badge{display:inline-flex;align-items:center;gap:4px;background:var(--bl);color:var(--b);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid rgba(24,95,165,.2)}

/* ── Responsive ── */
@media(max-width:640px){
  .stats{grid-template-columns:1fr 1fr}
  .frow.three,.frow{grid-template-columns:1fr}
  .amen-grid{grid-template-columns:1fr 1fr}
  .topbar{height:auto;padding:10px 14px;flex-wrap:wrap}
  .pg-grid{grid-template-columns:1fr}
}

</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="brand"><div class="brand-dot"></div>PG Finder BLR</a>
  <div class="topbar-right">
    <div class="sync-pill"><div class="sdot" id="sdot"></div><span id="slbl">Local</span></div>
    <a href="manage.html" class="btn btn-sm btn-green">⚙️ Manage</a>
  </div>
</div>

<div class="wrap">
  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="n" id="s-total">0</div><div class="l">Total PGs</div></div>
    <div class="stat"><div class="n" id="s-rent">—</div><div class="l">Avg Single Rent</div></div>
    <div class="stat"><div class="n" id="s-score">—</div><div class="l">Avg Review Score</div></div>
    <div class="stat"><div class="n" id="s-food">0</div><div class="l">PGs with Food</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('browse')" id="tab-browse">🏠 Browse PGs</button>
    <button class="tab" onclick="switchTab('compare')" id="tab-compare">📊 Compare</button>
    <button class="tab" onclick="switchTab('distance')" id="tab-distance">📍 By Distance</button>
    <button class="tab" onclick="switchTab('summary')" id="tab-summary">📈 Summary</button>
  </div>

  <!-- BROWSE TAB -->
  <div id="pane-browse">
    <div class="sbar">
      <input id="q" placeholder="🔍 Search name, area, locality..." oninput="renderCards()">
      <select id="ff" onchange="renderCards()"><option value="">Any food</option><option value="yes">With food</option><option value="no">No food</option></select>
      <select id="gf" onchange="renderCards()"><option value="">Any gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="Co-ed">Co-ed</option></select>
      <select id="sf" onchange="renderCards()"><option value="name">Sort: Name</option><option value="rent">Rent ↑</option><option value="score">Score ↓</option></select>
      <button class="btn btn-sm" id="filter-toggle-btn" onclick="toggleFilters()">⚙️ Filters</button>
      <button class="btn btn-sm btn-red" id="filter-clear-btn" onclick="clearFilters()" style="display:none">✕ Clear filters</button>
    </div>

    <div id="filter-panel" style="display:none;background:var(--white);border:1px solid var(--gray-3);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">
        <div class="fg">
          <label>Max single rent ₹</label>
          <input type="number" id="filt-rent" placeholder="e.g. 12000" oninput="renderCards();updateFilterBtn()">
        </div>
        <div class="fg">
          <label>Min review score (0–10)</label>
          <input type="number" id="filt-score" placeholder="e.g. 7" min="0" max="10" step="0.5" oninput="renderCards();updateFilterBtn()">
        </div>
        <div class="fg">
          <label>Must-have amenity</label>
          <select id="filt-amen" onchange="renderCards();updateFilterBtn()">
            <option value="">Any amenity</option>
            <option value="laundry">Laundry</option>
            <option value="hk">Housekeeping</option>
            <option value="lift">Lift</option>
            <option value="parking">Parking</option>
            <option value="water">Drinking Water</option>
            <option value="cctv">CCTV</option>
            <option value="ac">AC Rooms</option>
            <option value="gym">Gym</option>
            <option value="power">Power Backup</option>
          </select>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
        <div class="fg">
          <label>Max deposit ₹</label>
          <input type="number" id="filt-deposit" placeholder="e.g. 20000" oninput="renderCards();updateFilterBtn()">
        </div>
        <div class="fg">
          <label>WiFi</label>
          <select id="filt-wifi" onchange="renderCards();updateFilterBtn()">
            <option value="">Any WiFi</option>
            <option value="Included in rent">Included in rent</option>
            <option value="Separate charge">Separate charge</option>
            <option value="Not available">Not available</option>
          </select>
        </div>
        <div class="fg">
          <label>Electricity</label>
          <select id="filt-elec" onchange="renderCards();updateFilterBtn()">
            <option value="">Any</option>
            <option value="Included in rent">Included in rent</option>
            <option value="Per unit metered">Per unit metered</option>

// ═══════════════════════════════════════════════════════════

  {id:'laundry',   label:'Laundry',        icon:'👕'},

// ── Default admin + sample users (first-run seed) ────────────

    { id:'admin1', username:'admin', password:btoa('Admin@123'), isAdmin:true,  active:true, created:'2025-01-01' },

// ── Config (JSONBin + Cloudinary) ────────────────────────────
function getCfg()       { try{return JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}catch(e){return{}} }

// ── JSONBin sync ─────────────────────────────────────────────
async function syncToCloud(data) {
  const cfg = getCfg();
  if (!cfg.jbinKey) return;
  try {
    if (!cfg.binId) {
      const r = await fetch('https://api.jsonbin.io/v3/b', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Master-Key':cfg.jbinKey,'X-Bin-Name':'PG Finder BLR'},
        body:JSON.stringify({pgs:data})
      });
      const d = await r.json();
      cfg.binId = d.metadata.id;
      saveCfg(cfg);
    } else {
      await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':cfg.jbinKey},
        body:JSON.stringify({pgs:data})
      });
    }
  } catch(e) { console.warn('Cloud sync failed', e); }
}

async function loadFromCloud() {
  const cfg = getCfg();
  if (!cfg.jbinKey || !cfg.binId) return null;
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}/latest`,
      {headers:{'X-Master-Key':cfg.jbinKey}});
    const d = await r.json();
    const pgs = d.record.pgs || [];
    localStorage.setItem(DB_KEY, JSON.stringify(pgs));
    return pgs;
  } catch(e) { return null; }
}

// ── Cloudinary upload ─────────────────────────────────────────
async function uploadImage(file, onProgress) {
  const cfg = getCfg();
  if (!cfg.cldName || !cfg.preset) {
    // base64 fallback
    return new Promise(res => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.readAsDataURL(file);
    });
  }
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', cfg.preset);
  fd.append('folder', 'pg_finder_blr');
  const xhr = new XMLHttpRequest();
  return new Promise((res, rej) => {
    xhr.upload.onprogress = e => { if(onProgress && e.lengthComputable) onProgress(e.loaded/e.total); };
    xhr.onload = () => {
      try { const d = JSON.parse(xhr.responseText); res(d.secure_url||''); }
      catch(e) { rej(e); }
    };
    xhr.onerror = () => rej(new Error('Upload failed'));
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${cfg.cldName}/image/upload`);
    xhr.send(fd);
  });
}

// ── Distance calculation ──────────────────────────────────────
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

async function geocodeAddress(input) {
  // Try to extract lat/lng from Google Maps links
  const patterns = [
    /[@/](-?\d+\.\d+),(-?\d+\.\d+)/,
    /q=(-?\d+\.\d+),(-?\d+\.\d+)/,
    /\?q=([^&]+)/
  ];
  for (const p of patterns) {
    const m = input.match(p);
    if (m && m[2]) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };
  }
  // Nominatim geocode
  try {
    const q = encodeURIComponent(input.includes('Bengaluru')||input.includes('Bangalore') ? input : input+', Bengaluru');
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`);
    const d = await r.json();
    if (d[0]) return { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) };
  } catch(e) {}
  return null;
}

async function getPGCoords(pg) {
  if (pg._lat && pg._lon) return { lat:pg._lat, lon:pg._lon };
  const loc = pg.mapLink || pg.addr;
  if (!loc) return null;
  const c = await geocodeAddress(loc);
  if (c) { pg._lat = c.lat; pg._lon = c.lon; }
  return c;
}

// ── Avg score ─────────────────────────────────────────────────
function avgScore(pg) {
  if (!pg.reviews || !pg.reviews.length) return 0;
  const v = pg.reviews.filter(r => r.score > 0);
  return v.length ? +(v.reduce((a,b) => a+b.score, 0)/v.length).toFixed(1) : 0;
}

// ── Score colour ──────────────────────────────────────────────
function scoreColor(s) {
  if (s >= 8)  return '#10b981';
  if (s >= 6)  return '#f59e0b';
  if (s > 0)   return '#ef4444';
  return '#6b7280';
}

// ── Number format ─────────────────────────────────────────────
function fmt(n) { return n ? Number(n).toLocaleString('en-IN') : '—'; }

// ── Toast helper (expects a #toast element) ───────────────────
function toast(msg, type='') {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.className = 'toast' + (type ? ' '+type : '');
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3200);
}

// ── Seed on load ─────────────────────────────────────────────
seedUsers();

     foodQ:'Variety of dishes, breakfast & dinner. Separate veg and non-veg.',clean:'Spotless common areas, housekeeping daily.',
     imgs:{amenity:[],food:[],infra:[]},added:'2025-02-10',updated:'2025-05-28'},
    {id:'pg3',name:'Comfort Stay PG',gender:'Co-ed',addr:'99, 1st Floor, Indiranagar 100 Feet Road, Bengaluru - 560038',

<script>
let DB = [], selectedForCompare = new Set();

// ── Init ─────────────────────────────────────────────────────
async function init() {
  const cloud = await loadFromCloud();
  DB = cloud || getDB();
  if (cloud) { document.getElementById('sdot').className='sdot ok'; document.getElementById('slbl').textContent='Synced'; }
  renderAll();
}

function renderAll() {
  updateStats();
  renderCards();
  renderCompareSelector();
  renderSummary();
}

// ── Stats ────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('s-total').textContent = DB.length;
  const rents = DB.map(p=>p.r1).filter(r=>r>0);
  document.getElementById('s-rent').textContent = rents.length ? '₹'+Math.round(rents.reduce((a,b)=>a+b,0)/rents.length).toLocaleString('en-IN') : '—';
  const scores = DB.map(p=>avgScore(p)).filter(s=>s>0);
  document.getElementById('s-score').textContent = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1)+'/10' : '—';
  document.getElementById('s-food').textContent = DB.filter(p=>p.food&&p.food.includes('Included')).length;
}

// ── Tab switcher ─────────────────────────────────────────────
function switchTab(t) {
  ['browse','compare','distance','summary'].forEach(id=>{
    document.getElementById('pane-'+id).style.display = id===t?'block':'none';
    document.getElementById('tab-'+id).classList.toggle('active', id===t);
  });
  if (t==='summary') renderSummary();
  if (t==='compare') renderCompareSelector();
}

// ── Render cards ──────────────────────────────────────────────
// ── Filter panel toggle ──────────────────────────────────────
function toggleFilters() {
  const panel = document.getElementById('filter-panel');
  const btn   = document.getElementById('filter-toggle-btn');
  const open  = panel.style.display === 'none' || panel.style.display === '';
  panel.style.display = open ? 'block' : 'none';
  btn.style.background   = open ? 'var(--gm)' : '';
  btn.style.color        = open ? '#fff'       : '';
  btn.style.borderColor  = open ? 'var(--gm)'  : '';
  btn.textContent        = open ? '⚙️ Filters ▲' : '⚙️ Filters';
}

function clearFilters() {
  ['filt-rent','filt-score','filt-deposit'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  ['filt-amen','filt-wifi','filt-elec'].forEach(id  => { const el=document.getElementById(id); if(el) el.selectedIndex=0; });
  updateFilterBtn();
  renderCards();
}

function getActiveFilters() {
  return {
    rent    : parseFloat(document.getElementById('filt-rent')?.value)    || 0,
    score   : parseFloat(document.getElementById('filt-score')?.value)   || 0,
    deposit : parseFloat(document.getElementById('filt-deposit')?.value) || 0,
    amen    : document.getElementById('filt-amen')?.value  || '',
    wifi    : document.getElementById('filt-wifi')?.value  || '',
    elec    : document.getElementById('filt-elec')?.value  || '',
  };
}

function updateFilterBtn() {
  const f = getActiveFilters();
  const active = f.rent || f.score || f.deposit || f.amen || f.wifi || f.elec;
  const clearBtn = document.getElementById('filter-clear-btn');
  if (clearBtn) clearBtn.style.display = active ? 'inline-flex' : 'none';

  const parts = [];
  if (f.rent)    parts.push(`Rent ≤ ₹${Number(f.rent).toLocaleString('en-IN')}`);
  if (f.score)   parts.push(`Score ≥ ${f.score}`);
  if (f.deposit) parts.push(`Deposit ≤ ₹${Number(f.deposit).toLocaleString('en-IN')}`);
  if (f.amen)    parts.push(f.amen.charAt(0).toUpperCase()+f.amen.slice(1));
  if (f.wifi)    parts.push('WiFi: '+f.wifi);
  if (f.elec)    parts.push('Electricity: '+f.elec);

  const summary = document.getElementById('filter-summary');
  if (summary) {
    summary.textContent = parts.length
      ? `✅ Active: ${parts.join(' · ')}  (${document.querySelectorAll('#grid .pg-card').length} results)`
      : '';
  }
}

function renderCards() {
  const q   = document.getElementById('q').value.toLowerCase().trim();
  const ff  = document.getElementById('ff').value;
  const gf  = document.getElementById('gf').value;
  const sf  = document.getElementById('sf').value;
  const f   = getActiveFilters();

  let list = DB.filter(pg => {
    // Text search — name OR address
    if (q && !pg.name.toLowerCase().includes(q) && !(pg.addr||'').toLowerCase().includes(q)) return false;
    // Food filter
    if (ff==='yes' && !(pg.food||'').includes('Included')) return false;
    if (ff==='no'  && (pg.food||'').includes('Included'))  return false;
    // Gender
    if (gf && pg.gender !== gf) return false;
    // Max rent
    if (f.rent && pg.r1 && pg.r1 > f.rent) return false;
    // PGs with no rent entered are shown unless a strict rent filter is set
    if (f.rent && !pg.r1) return false;
    // Min score
    if (f.score && avgScore(pg) < f.score) return false;
    // Max deposit
    if (f.deposit && pg.deposit && pg.deposit > f.deposit) return false;
    // Must-have amenity
    if (f.amen && !pg[f.amen]) return false;
    // WiFi exact match
    if (f.wifi && pg.wifi !== f.wifi) return false;
    // Electricity exact match
    if (f.elec && pg.elec !== f.elec) return false;
    return true;
  });

  if (sf==='rent')        list.sort((a,b) => (a.r1||999999)-(b.r1||999999));
  else if (sf==='score')  list.sort((a,b) => avgScore(b)-avgScore(a));
  else                    list.sort((a,b) => a.name.localeCompare(b.name));

  const grid = document.getElementById('grid');
  if (!list.length) {
    const hasFilters = q || ff || gf || f.rent || f.score || f.deposit || f.amen || f.wifi || f.elec;
    grid.innerHTML = `<div class="empty">
      <span class="empty-icon">🔍</span>
      ${DB.length
        ? `No PGs match your ${hasFilters?'filters':'search'}.<br><br>
           <button class="btn btn-sm btn-green" onclick="clearFilters();document.getElementById('q').value='';renderCards()">Clear all & show all PGs</button>`
        : 'No PGs in the database yet.'}
    </div>`;
    setTimeout(updateFilterBtn, 50);
    return;
  }
  grid.innerHTML = list.map(pg => cardHTML(pg)).join('');
  setTimeout(updateFilterBtn, 50);
}

function cardHTML(pg, distKm) {
  const sc = avgScore(pg);
  const thumb = (pg.imgs?.infra?.[0]) || (pg.imgs?.amenity?.[0]) || '';
  const ams = AMENITIES.filter(a=>pg[a.id]);
  return `<div class="pg-card" onclick="showDetail('${pg.id}')">
    ${thumb
      ? `<img class="pg-card-thumb" src="${thumb}" loading="lazy" alt="${pg.name}">`
      : `<div class="pg-card-thumb-empty">🏠</div>`}
    <div class="pg-card-body">
      <div class="pg-card-top">
        <div class="pg-card-name">${pg.name}</div>
        ${sc>0?`<div class="score-pill" style="background:${scoreColor(sc)}22;color:${scoreColor(sc)};border:1px solid ${scoreColor(sc)}44">⭐ ${sc}</div>`:''}
      </div>
      <div class="pg-card-loc">📍 ${pg.addr||'No address'}</div>
      ${distKm!=null?`<div class="pg-card-dist">🗺 ${distKm<1?(distKm*1000).toFixed(0)+' m':distKm.toFixed(1)+' km'} away</div>`:''}
      <div class="tag-row">
        ${pg.gender?`<span class="tag">${pg.gender}</span>`:''}
        ${ams.slice(0,4).map(a=>`<span class="tag">${a.label}</span>`).join('')}
        ${ams.length>4?`<span class="tag">+${ams.length-4}</span>`:''}
      </div>
      <div class="rent-row">
        ${pg.r1?`<span class="rent-pill">Single ₹${fmt(pg.r1)}</span>`:''}
        ${pg.r2?`<span class="rent-pill">Double ₹${fmt(pg.r2)}</span>`:''}
        ${pg.r3?`<span class="rent-pill">Triple ₹${fmt(pg.r3)}</span>`:''}
      </div>
      <div class="pg-card-foot">
        <div class="pg-card-contact">
          ${pg.phone||pg.email||'No contact'}
          ${pg.website?`<a href="${pg.website}" target="_blank" onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:3px;margin-left:6px;color:var(--gm);font-size:11px;text-decoration:none;border:1px solid rgba(29,158,117,.3);padding:1px 7px;border-radius:20px;background:var(--gl)">🌐 Website</a>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

// ── Detail view ───────────────────────────────────────────────
function showDetail(id) {
  const pg = DB.find(p=>p.id===id); if(!pg) return;
  const sc = avgScore(pg);
  const imgs = pg.imgs||{};
  const heroImg = imgs.infra?.[0]||imgs.amenity?.[0]||imgs.food?.[0]||'';

  const photoSection = (arr, emptyLabel) => {
    if (!arr||!arr.length) return `<div class="photo-grid"><div class="photo-empty">📷<div style="font-size:11px;margin-top:4px;color:var(--gray-4)">${emptyLabel}</div></div></div>`;
    return `<div class="photo-grid">${arr.map(s=>`<img class="photo-thumb" src="${s}" loading="lazy" onclick="openLB('${s}')" alt="photo">`).join('')}</div>`;
  };

// ── Compare ───────────────────────────────────────────────────
function renderCompareSelector() {
  const sel = document.getElementById('compare-selector');
  sel.innerHTML = DB.map(pg=>`
    <label style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid ${selectedForCompare.has(pg.id)?'var(--gm)':'var(--gray-3)'};background:${selectedForCompare.has(pg.id)?'var(--gl)':'var(--white)'};cursor:pointer;font-size:13px;font-weight:500;transition:all .15s">
      <input type="checkbox" ${selectedForCompare.has(pg.id)?'checked':''} onchange="toggleCompare('${pg.id}',this)" style="accent-color:var(--gm)">
      ${pg.name}
    </label>`).join('');
}

function toggleCompare(id, cb) {
  if (cb.checked) {
    if (selectedForCompare.size >= 4) { cb.checked=false; toast('Max 4 PGs can be compared','err'); return; }
    selectedForCompare.add(id);
  } else {
    selectedForCompare.delete(id);
  }
  renderCompareSelector();
}
function clearCompare() { selectedForCompare.clear(); renderCompareSelector(); document.getElementById('compare-result').innerHTML=''; }

function renderCompare() {
  const ids = [...selectedForCompare];
  if (ids.length < 2) { toast('Select at least 2 PGs','err'); return; }
  const pgs = ids.map(id=>DB.find(p=>p.id===id)).filter(Boolean);

  const rows = [
    {sec:'Basic',label:'PG Name',       val:pg=>pg.name},
    {label:'Gender',        val:pg=>pg.gender||'—'},
    {label:'Locality',      val:pg=>(pg.addr||'').split(',').slice(-3,-1).join(',').trim()||'—'},
    {sec:'Rent',label:'Single Bed ₹/mo',  val:pg=>pg.r1?`₹${fmt(pg.r1)}`:'—', best:'min', num:pg=>pg.r1||0},
    {label:'Double ₹/mo',  val:pg=>pg.r2?`₹${fmt(pg.r2)}`:'—', best:'min', num:pg=>pg.r2||0},
    {label:'Triple ₹/mo',  val:pg=>pg.r3?`₹${fmt(pg.r3)}`:'—', best:'min', num:pg=>pg.r3||0},
    {label:'Security Dep.', val:pg=>pg.deposit?`₹${fmt(pg.deposit)}`:'—', best:'min', num:pg=>pg.deposit||0},
    {label:'Maintenance',   val:pg=>pg.maint?`₹${fmt(pg.maint)}/mo`:'None', best:'min', num:pg=>pg.maint||0},
    {sec:'Charges',label:'Electricity',  val:pg=>pg.elec||'—'},
    {label:'Food',          val:pg=>pg.food||'—'},
    {label:'Food Charge',   val:pg=>pg.foodAmt?`₹${fmt(pg.foodAmt)}/mo`:'—', best:'min', num:pg=>pg.foodAmt||0},
    {label:'WiFi',          val:pg=>pg.wifi||'—'},
    {sec:'Amenities',label:'Laundry',   val:pg=>yn(pg.laundry)},
    {label:'Housekeeping',  val:pg=>yn(pg.hk)},
    {label:'Lift',          val:pg=>yn(pg.lift)},
    {label:'Parking',       val:pg=>yn(pg.parking)},
    {label:'Drinking Water',val:pg=>yn(pg.water)},
    {label:'CCTV',          val:pg=>yn(pg.cctv)},
    {label:'AC Rooms',      val:pg=>yn(pg.ac)},
    {label:'Gym',           val:pg=>yn(pg.gym)},
    {label:'Power Backup',  val:pg=>yn(pg.power)},
    {sec:'Reviews',label:'Avg Score /10',val:pg=>avgScore(pg)?avgScore(pg)+'/10':'—', best:'max', num:pg=>avgScore(pg)},
    {label:'Review Count',  val:pg=>(pg.reviews||[]).length||'—'},
    {label:'Food Quality',  val:pg=>pg.foodQ?pg.foodQ.substring(0,80)+'…':'—'},
    {label:'Cleanliness',   val:pg=>pg.clean?pg.clean.substring(0,80)+'…':'—'},
    {sec:'Contact',label:'Phone', val:pg=>pg.phone||'—'},
  ];

  const yn = v => v ? `<span class="yes-cell">✓ Yes</span>` : `<span class="no-cell">✗ No</span>`;

  let html = `<div style="overflow-x:auto;background:var(--white);border:1px solid var(--gray-3);border-radius:var(--radius-xl);box-shadow:var(--shadow)">
  <table class="compare-table">
  <thead><tr><th>Parameter</th>${pgs.map(pg=>`<th>${pg.name}<br><span style="font-weight:400;font-size:11px">${pg.gender||''}</span></th>`).join('')}</tr></thead>
  <tbody>`;

  for (const row of rows) {
    if (row.sec) {
      html += `<tr class="compare-section-row"><td colspan="${pgs.length+1}">${row.sec}</td></tr>`;
    }
    const vals = pgs.map(pg => row.val(pg));
    let bestIdx = -1;
    if (row.best && row.num) {
      const nums = pgs.map(pg => row.num(pg));
      const validNums = nums.filter(n=>n>0);
      if (validNums.length) {
        const target = row.best==='min' ? Math.min(...validNums) : Math.max(...validNums);
        bestIdx = nums.indexOf(target);
      }
    }
    html += `<tr><td>${row.label}</td>`;
    vals.forEach((v,i)=>{
      const isBest = i===bestIdx;
      html += `<td class="${isBest?'best-cell':''}">${v}</td>`;
    });
    html += `</tr>`;
  }

  html += `</tbody></table></div>
  <div style="font-size:12px;color:var(--gray-6);margin-top:10px;padding:0 4px">
    🟢 Green highlighted cells = best value in that row
  </div>`;
  document.getElementById('compare-result').innerHTML = html;
}

// ── Distance ──────────────────────────────────────────────────
let targetCoords = null;
async function calcDistances() {
  const input = document.getElementById('loc-input').value.trim();
  if (!input) { toast('Enter a location','err'); return; }
  const status = document.getElementById('dist-status');
  status.textContent = '⏳ Locating...';
  const coords = await geocodeAddress(input);
  if (!coords) { status.textContent = '❌ Could not find location. Try a more specific address.'; return; }
  targetCoords = coords;
  status.textContent = `✅ Target: ${coords.lat.toFixed(4)}, ${coords.lon.toFixed(4)}`;
  renderDistResults(coords);
}

async function useMyLocation() {
  if (!navigator.geolocation) { toast('Geolocation not supported','err'); return; }
  document.getElementById('dist-status').textContent = '⏳ Getting your location...';
  navigator.geolocation.getCurrentPosition(pos => {
    targetCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    document.getElementById('dist-status').textContent = `✅ Using your current location`;
    document.getElementById('loc-input').value = `${targetCoords.lat.toFixed(5)}, ${targetCoords.lon.toFixed(5)}`;
    renderDistResults(targetCoords);
  }, err => {
    document.getElementById('dist-status').textContent = '❌ Could not get your location. Please enter manually.';
  });
}

async function renderDistResults(target) {
  const res = document.getElementById('dist-results');
  res.innerHTML = `<div class="loader"><div class="spin"></div>Calculating distances...</div>`;

  const withDist = [];
  for (const pg of DB) {
    const coords = await getPGCoords(pg);
    if (coords) {
      withDist.push({ pg, dist: haversineKm(target.lat, target.lon, coords.lat, coords.lon) });
    } else {
      withDist.push({ pg, dist: null });
    }
  }
  withDist.sort((a,b) => {
    if (a.dist===null) return 1;
    if (b.dist===null) return -1;
    return a.dist - b.dist;
  });

  res.innerHTML = `
    <div style="font-size:13px;font-weight:600;color:var(--gray-7);margin-bottom:14px">
      ${withDist.filter(x=>x.dist!==null).length} PGs found with distance data, sorted nearest first
    </div>
    <div class="pg-grid">
      ${withDist.map(({pg,dist}) => cardHTML(pg, dist)).join('')}
    </div>`;

  // Re-bind click handlers
  document.querySelectorAll('#dist-results .pg-card').forEach(card => {
    card.onclick = () => {
      switchTab('browse');
      showDetail(card.querySelector('.pg-card-name') ? DB.find(p=>p.name===card.querySelector('.pg-card-name').textContent)?.id : null);
    };
  });
}
